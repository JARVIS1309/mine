    <script>
        const audio = document.getElementById('myAudio');

        function playAudio() {
            audio.play().catch(err => console.log("Autoplay blocked by browser."));

        function pauseAudio() {
            audio.pause();
        }

        function toggleLoop() {
            audio.loop = !audio.loop;
            alert('Loop is now ' + (audio.loop ? 'ON' : 'OFF'));
        }
